name: Build

on:
  push:
    branches: ['*']
    tags: ['v*.*.*']
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.23

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Test UI
        run: make testui

      - name: Test Go
        run: make testgo

  build:
    name: Build Multi-Platform
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Version
        id: version
        run: |
          version="$(git describe --tags --always)"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "image_version=${version#v}" >> $GITHUB_OUTPUT

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ddvk/rmfakecloud
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and extract binaries (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          outputs: type=local,dest=./dist-amd64
          target: gobuilder
          cache-from: type=gha

      - name: Build and extract binaries (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          outputs: type=local,dest=./dist-arm64
          target: gobuilder
          cache-from: type=gha

      - name: Rename and prepare artifacts
        run: |
          mkdir -p artifacts
          cp dist-amd64/rmfakecloud artifacts/rmfakecloud-linux-amd64
          cp dist-arm64/rmfakecloud artifacts/rmfakecloud-linux-arm64
          chmod +x artifacts/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: artifacts/*
          if-no-files-found: error
